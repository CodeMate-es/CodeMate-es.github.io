name: Deploy Hugo to GitHub Pages

on:
  push:
    branches:
      - main # O 'master' dependiendo de cómo se llame tu rama principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true  # Si usas temas de Hugo como submódulos de Git
          fetch-depth: 0    # Necesario para obtener información precisa de fechas/git

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true    # Cambia a 'false' si tu tema no requiere Hugo Extended

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public